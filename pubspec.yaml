name: flutter_multi_dropdown
description: >
  A Flutter dropdown widget with both single and multi-select capabilities.
  Features include checkboxes/radio buttons, search, debounce search,
  selection limit, built-in Select All support, and customizable UI.
  Ideal for forms, filters, and selection interfaces.
version: 1.0.0
homepage: https://github.com/NamanGajera/flutter_multi_dropdown
topics:
  - dropdown
  - multi-select
  - single-select
  - flutter-widget
  - selection
  - search

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

screenshots:
  - description: "Example screenshot 1"
    path: Images/custom_item_builder_dropdown.png
